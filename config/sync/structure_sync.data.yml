  -
    info: 'User registration guidelines'
    langcode: en
    uuid: bfdfe79a-ddac-4f4b-8b73-fb87703b593e
    bundle: basic
    revision_id: null
    rev_id_current: null
    fields:
      body:
        -
          value: "When you register please use your <strong>Real Name</strong> as your account name. Since this site exists for a club whose members, crew, and friends know each other by name in real life, we want to have registered users identified the same way here. Usernames need to be in the form: <strong>First Last</strong> (<em>with a space in between</em>). You will receive a registration confirmation notice sent to the email address listed with your registration.\r\n\r\nIf we see a user name that is not in the first-last format we will correct it (and will try to notify you), so if you can't login with the username you originally registered with try it in first-last format. If you still can't get in you can always login with the email address you used; then please contact one of us so we can check your account to figure out the glitch.\r\n"
          summary: null
          format: '1'
