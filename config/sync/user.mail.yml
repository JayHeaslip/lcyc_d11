_core:
  default_config_hash: 6CZIzFifRq3qbdq3n3nDpEOO4hWIQtKOAQNPvGNGKeM
langcode: en
cancel_confirm:
  subject: 'Account details for [user:name] at [site:name] (deleted)'
  body: "[user:name],\r\n\r\nYour account on [site:name] has been deleted."
password_reset:
  subject: 'Replacement login information for [user:name] at [site:name]'
  body: "[user:name],\r\n\r\nA request to reset the password for your account has been made at [site:name].\r\n\r\nYou may now log in to [site:url-brief] clicking on this link or copying and pasting it in your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis is a one-time login, so it can be used only once. It expires after one day and nothing will happen if it's not used.\r\n\r\nAfter logging in, you will be redirected to [user:edit-url] so you can change your password."
register_admin_created:
  subject: 'An administrator created an account for you at [site:name]'
  body: "[user:name],\r\n\r\nA site administrator at [site:name] has created an account for you. You may now log in to [site:login-url] using the following username and password:\r\n\r\nusername: [user:name]\r\npassword: \r\n\r\nYou may also log in by clicking on this link or copying and pasting it in your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis is a one-time login, so it can be used only once.\r\n\r\nAfter logging in, you will be redirected to [user:edit-url] so you can change your password.\r\n\r\n--  [site:name] team"
register_no_approval_required:
  subject: 'Account details for [user:name] at [site:name]'
  body: "[user:name],\r\n\r\nThank you for creating a web account at [site:name]. You may now log in to [site:login-url] using your email address, or the following username and password:\r\n\r\nusername: [user:name]\r\npassword: \r\n\r\nYou may also log in by clicking on this link or copying and pasting it in your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis is a one-time login, so it can be used only once.\r\n\r\nAfter logging in, you will be redirected to [user:edit-url] so you can change your password.\r\n\r\n--  [site:name] team"
register_pending_approval:
  subject: 'Account details for [user:name] at [site:name] (pending admin approval)'
  body: "[user:name],\r\n\r\nThank you for registering at [site:name]. Your application for an account is currently pending approval. Once it has been granted, you may log in to [site:login-url] using the following username and password:\r\n\r\nusername: [user:name]\r\npassword: \r\n\r\nYou may also log in by clicking on this link or copying and pasting it in your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis is a one-time login, so it can be used only once.\r\n\r\nAfter logging in, you may wish to change your password at [user:edit-url]\r\n\r\nYour new [site:name] membership also enables to you to login to other Drupal powered websites (e.g. http://www.drop.org/) without registering. Just use the following Drupal ID and password:\r\n\r\nDrupal ID: [user:name]@[site:url-brief]\r\npassword: \r\n\r\n\r\n--  [site:name] team"
register_pending_approval_admin:
  subject: 'Account details for [user:display-name] at [site:name] (pending admin approval)'
  body: |-
    [user:display-name] has applied for an account.

    [user:edit-url]
status_activated:
  subject: 'Account details for [user:name] at [site:name] (approved)'
  body: "[user:name],\r\n\r\nYour account at [site:name] has been activated.\r\n\r\nYou may now log in by clicking on this link or copying and pasting it in your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis is a one-time login, so it can be used only once.\r\n\r\nAfter logging in, you will be redirected to [user:edit-url] so you can change your password.\r\n\r\nOnce you have set your own password, you will be able to log in to [site:login-url] in the future using:\r\n\r\nusername: [user:name]\r\n"
status_blocked:
  subject: 'Account details for [user:name] at [site:name] (blocked)'
  body: "[user:name],\r\n\r\nYour account on [site:name] has been blocked."
status_canceled:
  subject: 'Account details for [user:name] at [site:name] (deleted)'
  body: "[user:name],\r\n\r\nYour account on [site:name] has been deleted."
