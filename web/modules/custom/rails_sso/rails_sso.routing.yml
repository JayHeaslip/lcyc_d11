rails_sso.redirect_page:
  path: '/sso/goto-rails'
  defaults:
    _controller: '\Drupal\rails_sso\Controller\SsoRedirectController::redirectToRails'
  requirements:
    _user_is_logged_in: 'TRUE' # Built-in Drupal guard to block anonymous users
    _permission: 'access SSO controller'
  options:
    no_cache: TRUE
    
    
