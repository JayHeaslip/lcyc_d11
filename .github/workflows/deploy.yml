name: Drupal 11 Dual-Environment Deploy

on:
  push:
    branches: [ master, staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # SAFETY CHECK: Validates composer files before building

      - name: Validate Composer
        run: composer validate --strict

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Dynamically choose the folder based on the branch
          target: ${{ github.ref == 'refs/heads/master' && '/home/lcyc/lcyc.info' || '/home/lcyc/d11.lcyc.info' }}
          source: "."
          rm: false 

