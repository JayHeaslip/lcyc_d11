name: Drupal 11 Multi-Environment Deploy (main,staging)

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main, staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Centralized logic for paths
      BRANCH: ${{ github.ref == 'refs/heads/main' && 'main' || 'staging' }}
      TARGET_PATH: ${{ github.ref == 'refs/heads/main' && '/home/lcyc/lcyc.info' || '/home/lcyc/d11.lcyc.info' }}
      SHARED_PATH: ${{ github.ref == 'refs/heads/main' && '/home/lcyc/shared/prod' || '/home/lcyc/shared/staging' }}
      URI: ${{ github.ref == 'refs/heads/main' && 'https://lcyc.info' || 'https://d11.lcyc.info' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Composer packages
        uses: actions/cache@v4
        id: composer-cache  # Optional: useful for conditional steps
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_mysql, zip
          tools: composer:v2

      - name: Configure Composer GitHub token
        run: |
          composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Validate & Install PHP Dependencies
        run: |
          composer validate --strict
          composer install --prefer-dist --no-dev --optimize-autoloader --no-progress

      - name: Setup Node.js & Build Theme
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd web/themes/custom/lcyc_radix
          npm ci
          npm run build

      - name: Cache node modules
        uses: actions/cache@v4
        id: node-cache
        with:
          path: ~/.npm
          key: $$   {{ runner.os }}-node-   $${{ hashFiles('web/themes/custom/lcyc_radix/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            
      - name: Create deploy archive
        run: |
          mkdir -p deploy-archive
          tar -czf deploy-archive/deploy.tar.gz \
          --exclude='./deploy-archive' \
          --exclude='.git' \
          --exclude='vendor' \
          --exclude='node_modules' \
          --exclude='web/sites/default/files' \
          --exclude='web/sites/default/default.services.yml' \
          --exclude='web/sites/default/default.settings.php' \
          --exclude='.github' \
          .
              
      - name: Ensure remote deploy-archive directory exists
        run: |
          echo "${{ secrets.SSH_KEY }}" > key
          chmod 600 key
          ssh -i key -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} "
          mkdir -p '${{ env.TARGET_PATH }}/deploy-archive/'
          "
            
      - name: Deploy files via SCP (clean & fast)
        run: |
          echo "${{ secrets.SSH_KEY }}" > key
          chmod 600 key
          scp -i key -o StrictHostKeyChecking=no -r deploy-archive/deploy.tar.gz ${{ secrets.USERNAME }}@${{ secrets.HOST }}:"${{ env.TARGET_PATH }}/deploy-archive/"

      - name: Prepare short SHA for deploy info
        run: echo "DEPLOY_SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Remote Post-Deploy (SSH commands)
        run: |
          echo "${{ secrets.SSH_KEY }}" > key
          chmod 600 key
          ssh -T -i key -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
          set -euo pipefail
          source ~/.bash_profile 2>/dev/null || true
          
          # ── Set timezone override FIRST ──
          export TZ='America/New_York'
          TARGET_PATH="${{ env.TARGET_PATH }}"
          SHARED_PATH="${{ env.SHARED_PATH }}"
          URI="${{ env.URI }}"
          BRANCH="${{ env.BRANCH }}"
          DEPLOY_SHA_SHORT="${{ env.DEPLOY_SHA_SHORT }}"
          cd "$TARGET_PATH" || { echo "Failed to cd to $TARGET_PATH"; exit 1; }

          # ── Enable maintenance mode EARLY ───────────────────────────────────────
          echo "=== Enabling maintenance mode ==="
          drush -l "$URI" maint:set 1 || drush -l "$URI" state:set system.maintenance_mode 1 --input-format=integer
          drush -l "$URI" cr   # important: flush cache so visitors immediately see maintenance page

          # Optional: nicer message (you can customize or remove)
          drush -l "$URI" config:set system.maintenance message "Site is being updated — back in a few minutes." -y
          
          # Add diagnostics BEFORE Drush
          echo "=== Pre-Drush diagnostics ==="
          pwd
          ls -l vendor/bin/drush || echo "vendor/bin/drush MISSING!"
          drush --version || echo "Drush version check failed"
          drush -l "$URI" status --fields=bootstrap,db-status --format=string
          
          mkdir -p "$SHARED_PATH/backups"
          drush sql:dump --quiet --gzip --extra-dump=--no-tablespaces --result-file="$SHARED_PATH/backups/pre-deploy-$BRANCH-$(date +%F-%H%M).sql"
          find "$SHARED_PATH/backups" -type f -name "*.sql.gz" -mtime +7 -delete
          tar -xzf deploy-archive/deploy.tar.gz
          rm -rf deploy-archive
          
          ln -sf "$SHARED_PATH/settings.php" web/sites/default/settings.php
          ln -sf "$SHARED_PATH/civicrm.settings.php" web/sites/default/civicrm.settings.php
          
          chmod 644 web/sites/default/civicrm.settings.php
          # → e.g. "a1b2c3d on 2026-05-20 14:35 EDT"
          NOW="$(date +'%Y-%m-%d %H:%M %Z')"
          DEPLOY_INFO="${DEPLOY_SHA_SHORT} on $NOW"
          echo "Deployment revision: $DEPLOY_INFO"   # Removed \$ to actually expand
          drush -l "$URI" state:set -v system.deployment_revision "$DEPLOY_INFO"
          
          # Drupal Deploy Sequence - crank verbosity, redirect stderr to stdout, force output
          echo "=== Starting drush deploy ==="
          drush -l "$URI" deploy -y -v 2>&1   
          # Or break it out for max visibility:
          # $PHP_BIN vendor/bin/drush -l "$URI" updatedb -y -vv 2>&1
          # $PHP_BIN vendor/bin/drush -l "$URI" config:import -y -vv --preview 2>&1   # Preview first
          # $PHP_BIN vendor/bin/drush -l "$URI" config:import -y -vv 2>&1
          # $PHP_BIN vendor/bin/drush -l "$URI" cr -vv 2>&1
          
          echo "=== Post-deploy checks ==="
          drush -l "$URI" pm:list --status=enabled | grep vite || echo "vite NOT enabled!"
          drush -l "$URI" config:status -v

          # ── Disable maintenance mode at the very end ─────────────────────────────
          echo "=== Disabling maintenance mode ==="
          drush -l "$URI" maint:set 0 || drush -l "$URI" state:set system.maintenance_mode 0 --input-format=integer
          drush -l "$URI" cr   # final rebuild

          # Optional: clear the custom maintenance message
          drush -l "$URI" config:delete system.maintenance message -y 2>/dev/null || true
          
          echo "Deployment complete."
          EOF

