name: Drupal 11 Multi-Environment Deploy (main,staging)

on:
  push:
    branches: [ main, staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Centralized logic for paths
      BRANCH: ${{ github.ref == 'refs/heads/main' && 'main' || 'staging' }}
      TARGET_PATH: ${{ github.ref == 'refs/heads/main' && '/home/lcyc/lcyc.info' || '/home/lcyc/d11.lcyc.info' }}
      SHARED_PATH: ${{ github.ref == 'refs/heads/main' && '/home/lcyc/shared/prod' || '/home/lcyc/shared/staging' }}
      URI: ${{ github.ref == 'refs/heads/main' && 'https://lcyc.info' || 'https://d11.lcyc.info' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Composer packages
        uses: actions/cache@v4
        id: composer-cache  # Optional: useful for conditional steps
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, pdo_mysql, zip
          tools: composer:v2

      - name: Configure Composer GitHub token
        run: |
          composer config -g github-oauth.github.com ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Validate & Install PHP Dependencies
        run: |
          composer validate --strict
          composer install --prefer-dist --no-dev --optimize-autoloader --no-progress

      - name: Setup Node.js & Build Theme
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd web/themes/custom/lcyc_radix
          npm install
          npm run build

      - name: Create deploy archive
        run: |
          mkdir -p deploy-archive
          tar -czf deploy-archive/deploy.tar.gz \
          --exclude='./deploy-archive' \
          --exclude='.git' \
          --exclude='vendor' \
          --exclude='node_modules' \
          --exclude='web/sites/default/files' \
          --exclude='web/sites/default/default.services.yml' \
          --exclude='web/sites/default/default.settings.php' \
          --exclude='.github' \
          .
              
      - name: Ensure remote deploy-archive directory exists
        run: |
          echo "${{ secrets.SSH_KEY }}" > key
          chmod 600 key
          ssh -i key -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} "
          mkdir -p '${{ env.TARGET_PATH }}/deploy-archive/'
          "
            
      - name: Deploy files via SCP (clean & fast)
        run: |
          echo "${{ secrets.SSH_KEY }}" > key
          chmod 600 key
          scp -i key -o StrictHostKeyChecking=no -r deploy-archive/deploy.tar.gz ${{ secrets.USERNAME }}@${{ secrets.HOST }}:"${{ env.TARGET_PATH }}/deploy-archive/"

      - name: Prepare short SHA for deploy info
        run: echo "DEPLOY_SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Remote Post-Deploy (SSH commands)
        run: |
          echo "${{ secrets.SSH_KEY }}" > key
          chmod 600 key
          ssh -T -i key -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'
            set -euo pipefail

            # ── Set timezone override FIRST ──
            export TZ='America/New_York'

            TARGET_PATH="${{ env.TARGET_PATH }}"
            SHARED_PATH="${{ env.SHARED_PATH }}"
            URI="${{ env.URI }}"
            BRANCH="${{ env.BRANCH }}"
            DEPLOY_SHA_SHORT="${{ env.DEPLOY_SHA_SHORT }}"

            cd "$TARGET_PATH" || { echo "Failed to cd to $TARGET_PATH"; exit 1; }

            PHP_BIN="/usr/local/php83/bin/php"
            
            mkdir -p "$SHARED_PATH/backups"

            $PHP_BIN vendor/bin/drush sql:dump --quiet --gzip --extra-dump=--no-tablespaces --result-file="$SHARED_PATH/backups/pre-deploy-$BRANCH-$(date +%F-%H%M).sql"

            find "$SHARED_PATH/backups" -type f -name "*.sql.gz" -mtime +7 -delete            

            tar -xzf deploy-archive/deploy.tar.gz
            rm -rf deploy-archive
            
            ln -sf "$SHARED_PATH/settings.php" web/sites/default/settings.php
            ln -sf "$SHARED_PATH/civicrm.settings.php" web/sites/default/civicrm.settings.php
            
            chmod 644 web/sites/default/civicrm.settings.php

            # → e.g. "a1b2c3d on 2026-05-20 14:35 EDT"
            NOW="$(date +'%Y-%m-%d %H:%M %Z')"
            DEPLOY_INFO="${DEPLOY_SHA_SHORT} on $NOW"
            echo "Deployment revision: \$DEPLOY_INFO"

            $PHP_BIN vendor/bin/drush state:set -vv system.deployment_revision "\$DEPLOY_INFO"

            # Drupal Deploy Sequence
            $PHP_BIN vendor/bin/drush -l "$URI" deploy -y -v

            echo "Deployment complete."
            
          EOF
    
