name: Drupal 11 Multi-Environment Deploy

on:
  push:
    branches: [ main, staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Centralized logic for paths
      TARGET_PATH: ${{ github.ref == 'refs/heads/main' && '/home/lcyc/lcyc.info' || '/home/lcyc/d11.lcyc.info' }}
      SHARED_PATH: ${{ github.ref == 'refs/heads/main' && '/home/lcyc/shared/prod' || '/home/lcyc/shared/staging' }}
      URI: ${{ github.ref == 'refs/heads/main' && "https://lcyc.info" || "https://d11.lcyc.info" }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, pdo_mysql, zip
          tools: composer:v2

      - name: Validate & Install PHP Dependencies
        run: |
          composer validate --strict
          composer install --no-dev --optimize-autoloader

      - name: Setup Node.js & Build Theme
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd web/themes/custom/lcyc_radix
          npm install
          npm run production

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          target: ${{ env.TARGET_PATH }}
          source: "."
          rm: false

      - name: Remote Post-Deploy (Backup & Sync)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ env.TARGET_PATH }}
            
            # 1. Database Backup (Safety First)
            mkdir -p ${{ env.SHARED_PATH }}/backups
            vendor/bin/drush sql:dump --gzip --extra-dump=--no-tablespaces --result-file=${{ env.SHARED_PATH }}/backups/pre-deploy-$(date +%F-%H%M).sql
            
            # 2. Re-link Permanent Files
            ln -sf ${{ env.SHARED_PATH }}/settings.php web/sites/default/settings.php
            ln -sf ${{ env.SHARED_PATH }}/civicrm.settings.php web/sites/default/civicrm.settings.php
            
            # 3. CiviCRM Permission Fix
            chmod 644 web/sites/default/civicrm.settings.php
            
            # 4. Drupal Deploy Sequence
            vendor/bin/drush -l ${{ env.URI }} deploy -y
