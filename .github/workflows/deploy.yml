name: Drupal 11 Multi-Environment Deploy

on:
  push:
    branches: [ main, staging ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Centralized logic for paths
      TARGET_PATH: ${{ github.ref == 'refs/heads/main' && '/home/lcyc/lcyc.info' || '/home/lcyc/d11.lcyc.info' }}
      SHARED_PATH: ${{ github.ref == 'refs/heads/main' && '/home/lcyc/shared/prod' || '/home/lcyc/shared/staging' }}
      URI: ${{ github.ref == 'refs/heads/main' && 'https://lcyc.info' || 'https://d11.lcyc.info' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Composer packages
        uses: actions/cache@v4
        id: composer-cache  # Optional: useful for conditional steps
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, pdo_mysql, zip
          tools: composer:v2

      - name: Configure Composer GitHub token
        run: |
          composer config -g github-oauth.github.com ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Validate & Install PHP Dependencies
        run: |
          composer validate --strict
          composer install --prefer-dist --no-dev --optimize-autoloader --no-progress

      - name: Setup Node.js & Build Theme
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd web/themes/custom/lcyc_radix
          npm install
          npm run production

      - name: Create deploy archive
        run: |
          mkdir -p deploy-archive
          tar -czf deploy-archive/deploy.tar.gz \
          --exclude='./deploy-archive' \
          --exclude='.git' \
          --exclude='vendor' \
          --exclude='node_modules' \
          --exclude='web/sites/default/files' \
          --exclude='web/sites/default/default.services.yml' \
          --exclude='web/sites/default/default.settings.php' \
          --exclude='.github' \
          .
              
      - name: Deploy to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          target: ${{ env.TARGET_PATH }}
          source: "deploy-archive/deploy.tar.gz"
          overwrite: true

      - name: Remote Post-Deploy (Backup & Sync)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: TARGET_PATH,SHARED_PATH,URI
          script: |
            set -e
            cd $TARGET_PATH || { echo "Failed to cd"; exit 1; }

            PHP_BIN="/usr/local/php83/bin/php"
            
            # Database Backup (Safety First)
            mkdir -p $SHARED_PATH/backups
            $PHP_BIN vendor/bin/drush sql:dump --quiet --gzip --extra-dump=--no-tablespaces --result-file=${{ env.SHARED_PATH }}/backups/pre-deploy-$(date +%F-%H%M).sql

            # DELETE OLD BACKUPS (Older than 7 days)
            # This finds files in the backup dir ending in .sql.gz and removes them if they are 7+ days old
            find $SHARED_PATH/backups -type f -name "*.sql.gz" -mtime +7 -delete            

            # extract file
            tar -xzf deploy-archive/deploy.tar.gz
            rm -f deploy-archive/deploy.tar.gz
            
            # Re-link Permanent Files
            ln -sf $SHARED_PATH/settings.php web/sites/default/settings.php
            ln -sf $SHARED_PATH/civicrm.settings.php web/sites/default/civicrm.settings.php
            
            # CiviCRM Permission Fix
            chmod 644 web/sites/default/civicrm.settings.php

            # Create a combined string: "a1b2c3d on 2026-05-20"
            DEPLOY_INFO="$(echo ${{ github.sha }} | cut -c1-7) on $(date +'%Y-%m-%d %H:%M')"
            echo "DEBUG: DEPLOY_INFO is set to: '$DEPLOY_INFO'"
            echo "DEBUG: Running drush state:set system.deployment_revision '$DEPLOY_INFO'"
            $PHP_BIN vendor/bin/drush state:set system.deployment_revision "$DEPLOY_INFO" --quiet
            # Verify it immediately
            $PHP_BIN vendor/bin/drush state:get system.deployment_revision || echo "State get failed!"

            # Drupal Deploy Sequence
            $PHP_BIN vendor/bin/drush -l $URI deploy -y --quiet
